name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # npm provenance
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: packages/npm/package-lock.json
      - run: npm ci
        working-directory: packages/npm
      - run: npm publish --provenance --access public
        working-directory: packages/npm
        env:
          # NPM_TOKEN: granular access token with publish rights, set as a repo secret.
          # Provenance requires the id-token permission above but npm still needs this
          # token to authenticate the publish itself.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing (OIDC) — no token secret needed
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install build
      - run: node scripts/sync-data.mjs pypi
      - run: python3 -m build
        working-directory: packages/pypi
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/pypi/dist
