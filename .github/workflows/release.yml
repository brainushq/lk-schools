name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # npm provenance
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: packages/npm/package-lock.json
      - run: npm install -g npm@latest # trusted publishing needs npm CLI >= 11.5.1
      - run: npm ci
        working-directory: packages/npm
      - run: npm publish
        working-directory: packages/npm
        # No token: authenticated via OIDC trusted publishing, configured on
        # npmjs.com under this package's Settings -> Trusted Publisher, once
        # the package exists from its first (manual, local) publish.

  publish-pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing (OIDC) — no token secret needed
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install build
      - run: node scripts/sync-data.mjs pypi
      - run: python3 -m build
        working-directory: packages/pypi
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/pypi/dist
