name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 -c "import json; json.load(open('data/schools.json')); json.load(open('data/districts.json'))"

  build-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/npm/package-lock.json
      - run: npm ci
        working-directory: packages/npm
      - run: npm run build
        working-directory: packages/npm

  build-pypi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install build
      - run: node scripts/sync-data.mjs pypi
      - run: python3 -m build
        working-directory: packages/pypi
